name: Deploy Secrets

# Run manually or whenever you need to rotate / create secrets.
# Each GitHub environment (staging / production) holds its own secret values.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [staging, production]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-secrets:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Write SecureString parameters to SSM
        # CloudFormation does not support SecureString, so we write them directly.
        # Run deploy-infra first so the Lambda's SSM read policy already exists.
        env:
          SSM_PREFIX: /pintwood/${{ inputs.environment }}
          SPREADSHEET_ID: ${{ vars.REGISTRATION_SPREADSHEET_ID }}
          SHEET_NAME:     ${{ vars.REGISTRATION_SHEET_NAME }}
          SA_EMAIL:       ${{ vars.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          SA_KEY:         ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          SENDGRID_KEY:   ${{ secrets.SENDGRID_API_KEY }}
          RECAPTCHA_KEY:  ${{ secrets.RECAPTCHA_SECRET_KEY }}
        run: |
          put() {
            aws ssm put-parameter \
              --name "${SSM_PREFIX}/$1" \
              --value "$2" \
              --type SecureString \
              --overwrite \
              --region us-east-1 \
              --no-cli-pager
            echo "✓ ${SSM_PREFIX}/$1"
          }
          put REGISTRATION_SPREADSHEET_ID        "$SPREADSHEET_ID"
          put REGISTRATION_SHEET_NAME            "$SHEET_NAME"
          put GOOGLE_SERVICE_ACCOUNT_EMAIL       "$SA_EMAIL"
          put GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY "$SA_KEY"
          put SENDGRID_API_KEY                   "$SENDGRID_KEY"
          put RECAPTCHA_SECRET_KEY               "$RECAPTCHA_KEY"
