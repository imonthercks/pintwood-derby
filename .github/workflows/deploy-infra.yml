name: Deploy Infrastructure

# Run manually when CDK stack changes are needed.
# Must complete before deploy-site runs for the first time in an environment.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [staging, production]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install repo dependencies
        # Provides esbuild (and other root deps) for CDK's Lambda bundling, which
        # invokes esbuild with the repo root as its working directory.
        run: npm ci

      - name: Install Lambda dependencies (submit-registration)
        # esbuild resolves each Lambda's runtime dependencies (e.g. @aws-sdk/client-ssm,
        # google-auth-library, handlebars) by walking up from the entry file, so they
        # must be installed here even though the root deps are installed above.
        run: npm ci
        working-directory: lambda/submit-registration

      - name: Install Lambda dependencies (accept-registration)
        # Required for local bundling of AcceptRegistrationFn (dependency lives in lambda/accept-registration).
        run: npm ci
        working-directory: lambda/accept-registration
      - name: Install CDK dependencies
        run: npm ci
        working-directory: infra

      - name: Read hosted zone ID from DNS stack (if deployed)
        id: dns
        run: |
          zone_id=$(aws cloudformation describe-stacks \
            --stack-name PintwoodDnsStack \
            --query "Stacks[0].Outputs[?OutputKey=='HostedZoneId'].OutputValue" \
            --output text 2>/dev/null || true)
          echo "hosted_zone_id=$zone_id" >> "$GITHUB_OUTPUT"

      - name: CDK deploy
        run: |
          extra_context=()
          if [[ -n "${{ steps.dns.outputs.hosted_zone_id }}" ]]; then
            extra_context+=(--context "hostedZoneId=${{ steps.dns.outputs.hosted_zone_id }}")
          fi
          npx cdk deploy PintwoodStack-${{ inputs.environment }} \
            --context stackEnv=${{ inputs.environment }} \
            "${extra_context[@]}" \
            --require-approval never \
            --outputs-file cdk-outputs.json
        working-directory: infra

      - name: Print stack outputs
        run: |
          echo "Stack outputs (use these to verify — values are stored in CloudFormation):"
          cat infra/cdk-outputs.json
