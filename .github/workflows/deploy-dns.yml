name: Deploy DNS

# Run manually to create/update the Route53 hosted zone for thepintwood.com.
# Run this before deploy-infra so each PintwoodStack can create its own alias
# record (apex -> production, staging.thepintwood.com -> staging) once the zone exists.
on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dns:
    runs-on: ubuntu-latest
    # DNS spans both environments; the production role has the Route53 permissions needed.
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install repo dependencies
        run: npm ci

      - name: Install CDK dependencies
        run: npm ci
        working-directory: infra

      - name: CDK deploy
        run: |
          npx cdk deploy PintwoodDnsStack \
            --context dns=true \
            --context resendDkimPublicKey="${{ secrets.RESEND_DKIM_PUBLIC_KEY }}" \
            --require-approval never \
            --outputs-file dns-outputs.json
        working-directory: infra

      - name: Print name servers
        run: |
          echo "If thepintwood.com isn't already delegated to Route53, update the name servers at your registrar (Netlify DNS):"
          cat infra/dns-outputs.json

