name: Deploy Site

on:
  push:
    branches: [main, staging]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    # github environment name matches the branch (main → production, staging → staging)
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.128.0'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Read CloudFormation stack outputs
        id: cf
        env:
          STACK_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
        run: |
          outputs=$(aws cloudformation describe-stacks \
            --stack-name PintwoodStack-${STACK_ENV} \
            --query 'Stacks[0].Outputs' \
            --output json)

          get() { echo "$outputs" | jq -r --arg k "$1" '.[] | select(.OutputKey==$k) | .OutputValue'; }

          echo "api_endpoint=$(get ApiEndpoint)"          >> "$GITHUB_OUTPUT"
          echo "bucket=$(get SiteBucketName)"             >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(get DistributionId)"   >> "$GITHUB_OUTPUT"
          echo "cloudfront_domain=$(get CloudFrontDomain)" >> "$GITHUB_OUTPUT"

      - name: Build Hugo site
        env:
          # Production uses the real domain (set as a GitHub environment variable, not a secret).
          # Staging falls back to the CloudFront domain from the stack output.
          HUGO_BASEURL: ${{ vars.HUGO_BASEURL || format('https://{0}', steps.cf.outputs.cloudfront_domain) }}
          HUGO_PARAM_APIENDPOINT: ${{ steps.cf.outputs.api_endpoint }}
        run: hugo --minify

      - name: Sync to S3
        run: aws s3 sync public/ s3://${{ steps.cf.outputs.bucket }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cf.outputs.distribution_id }} \
            --paths "/*"
